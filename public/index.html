<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131b">
  <title>Ai — Local AI Chat</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">A</span><div><h1>Ai</h1><p>Independent local AI</p></div></div>
      <div class="top-actions">
        <button id="load-model" class="model-button" type="button" disabled>Check GPU…</button>
        <button id="clear-chat" class="subtle-button" type="button">Clear chat</button>
      </div>
    </header>
    <section id="messages" class="messages" aria-live="polite">
      <article class="message assistant">
        <div class="avatar">A</div>
        <div class="bubble"><strong>Ai</strong><p>Hi. I'm Ai. Load my local model to start chatting. The first model download is large, but it is cached by your browser.</p></div>
      </article>
    </section>
    <form id="chat-form" class="composer">
      <label class="sr-only" for="message-input">Message Ai</label>
      <textarea id="message-input" rows="1" maxlength="8000" placeholder="Load the local model first..." autocomplete="off" required disabled></textarea>
      <button id="send-button" type="submit" aria-label="Send message" disabled>Send</button>
    </form>
    <footer><span id="status">Checking device GPU…</span><span>On-device model · No AI API</span></footer>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
